[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-health-prober"
version = "0.1.0"
description = "Concurrent synthetic API & HTTP endpoint uptime prober with latency percentiles, keyword assertions, and SSL expiry checks."
readme = "README.md"
authors = [{ name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
api-health-prober = "health_prober.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
